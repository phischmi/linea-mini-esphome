# Passive CN11 sniffer for the La Marzocco Linea Mini (listen only, never transmits).
# Guide: docs/guides/sniffer.md
#
# Two receive-only UARTs, both 9600 8N1 and inverted (CN11 is idle-low):
#   uart_m: CN11 pin 3 "TXD" (machine -> module)   logged as channel M
#   uart_b: CN11 pin 2 "RXD" (module -> machine)   logged as channel B
# The pin labels on the plug can be swapped (see docs/hardware/cn11-interface.md).
# If the poll "R40000023DB" shows up on channel M, swap the two GPIOs below.
#
# Target board: Seeed XIAO ESP32-S3 (see docs/hardware/cn11-interface.md, "Board and pins").
#
# No tx_pin is configured on purpose. Do not wire any ESP32 output to the machine.
# Output is the USB serial log. No Wi-Fi, no API: nothing else touches the bus timing.

substitutions:
  name: linea-sniffer
  # XIAO ESP32-S3: D7 = GPIO44 (RX header pin), D6 = GPIO43 (TX header pin).
  # Same physical lines as in the later read-only setup (examples/linea_mini_readonly.yaml):
  #   D7 <- CN11 TXD line (machine -> module)   channel M
  #   D6 <- CN11 RXD line (module -> machine)   channel B (used as an input here, never driven)
  # Other boards: change board and pins, avoid strapping/flash/PSRAM/USB pins.
  pin_m: GPIO44
  pin_b: GPIO43

esphome:
  name: ${name}

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # GPIO43/44 are the default UART0 pins, so the log goes over the USB-C port instead.
  hardware_uart: USB_SERIAL_JTAG

uart:
  - id: uart_m
    rx_pin:
      number: ${pin_m}
      inverted: true
    baud_rate: 9600
    rx_buffer_size: 2048
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: 200
        timeout: 15ms
      sequence:
        - lambda: |-
            std::string s;
            for (uint8_t c : bytes) s += (c >= 32 && c < 127) ? (char) c : '.';
            ESP_LOGI("snf", "M %u %s", (unsigned) millis(), s.c_str());

  - id: uart_b
    rx_pin:
      number: ${pin_b}
      inverted: true
    baud_rate: 9600
    rx_buffer_size: 2048
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: 200
        timeout: 15ms
      sequence:
        - lambda: |-
            std::string s;
            for (uint8_t c : bytes) s += (c >= 32 && c < 127) ? (char) c : '.';
            ESP_LOGI("snf", "B %u %s", (unsigned) millis(), s.c_str());
